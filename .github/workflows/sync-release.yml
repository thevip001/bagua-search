name: Sync release files

on:
  push:
    paths:
      - 'versions/*.user.js'
      - 'docs/greasyfork.zh-CN.md'
      - 'docs/images/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy latest userscript to root
        run: |
          latest=$(ls -1 versions/*.user.js | sort -V | tail -n 1)
          cp "$latest" '八卦搜索.user.js'
          echo "Copied $latest to 八卦搜索.user.js"

      - name: Prepare README with absolute image links
        run: |
          sed -E 's#\((\./)?(docs/)?images/([^)]+)\)#(https://raw.githubusercontent.com/thevip001/bagua-search/main/docs/images/\3)#g' \
            'docs/greasyfork.zh-CN.md' > 'README.md'

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '八卦搜索.user.js' 'README.md'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: sync latest release script and documentation'
            git push
          fi
