name: Publish userscript 0.1.16

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-0.1.16.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-bagua-search
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified 0.1.15 to 0.1.16 changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          p = pathlib.Path('八卦搜索.user.js')
          raw = p.read_bytes()
          old_sha = '4678dc5a629f55f549ea086a9a32fa5e2f28696dba83276f3c6b2f51b958b7c6'
          new_sha = 'ff22808f7692753fa1b87700d6127893f971a27611e039460e1b51657a3c84a6'
          current = hashlib.sha256(raw).hexdigest()
          if current != new_sha:
              assert current == old_sha, 'Source changed; refusing to overwrite'
              text = raw.decode('utf-8')
              dictionary = (text[135000:147000] + text[179000:198000]).encode()
              packed = base64.b64decode('')
              decoder = zlib.decompressobj(-15, zdict=dictionary)
              edits = json.loads(decoder.decompress(packed) + decoder.flush())
              for start, stop, replacement in reversed(edits):
                  assert 0 <= start <= stop <= len(text)
                  text = text[:start] + replacement + text[stop:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == new_sha, 'Output checksum mismatch'
              p.write_bytes(result)
          PY
          node --check '八卦搜索.user.js'
          git add -- '八卦搜索.user.js'
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'release: publish 八卦搜索 0.1.16'
            git push origin HEAD:main
          fi
