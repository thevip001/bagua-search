name: Generate 0.1.18 baseline

on:
  push:
    paths:
      - '.github/workflows/generate-0.1.18-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create 0.1.18 baseline from verified 0.1.17
        run: |
          set -euo pipefail
          src='versions/八卦搜索-0.1.17.user.js'
          test -f "$src"
          cp "$src" 'versions/八卦搜索-0.1.18.user.js'
          cp "$src" '八卦搜索.user.js'
          sed -i 's/@version[[:space:]]*0\.1\.17/@version 0.1.18/' 'versions/八卦搜索-0.1.18.user.js'
          sed -i 's/@version[[:space:]]*0\.1\.17/@version 0.1.18/' '八卦搜索.user.js'
          grep -n '@version' 'versions/八卦搜索-0.1.18.user.js'
          grep -n '@version' '八卦搜索.user.js'

      - name: Commit 0.1.18 baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'versions/八卦搜索-0.1.18.user.js' '八卦搜索.user.js'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: create 0.1.18 baseline from verified 0.1.17'
            git push
          fi