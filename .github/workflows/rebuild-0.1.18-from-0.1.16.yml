name: Rebuild 0.1.18 from verified 0.1.16

on:
  push:
    paths:
      - '.github/workflows/rebuild-0.1.18-from-0.1.16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Extract verified 0.1.16 baseline
        run: |
          set -euo pipefail
          git show '328aa0dc4193fb3dcd2dd7884c9fa84ebebe2d42:八卦搜索.user.js' > 'versions/八卦搜索-0.1.16.user.js'
          grep -q '@version[[:space:]]*0\.1\.16' 'versions/八卦搜索-0.1.16.user.js'

      - name: Create clean 0.1.18 baseline
        run: |
          set -euo pipefail
          cp 'versions/八卦搜索-0.1.16.user.js' 'versions/八卦搜索-0.1.18.user.js'
          cp 'versions/八卦搜索-0.1.16.user.js' '八卦搜索.user.js'
          sed -i 's/@version[[:space:]]*0\.1\.16/@version 0.1.18/' 'versions/八卦搜索-0.1.18.user.js'
          sed -i 's/@version[[:space:]]*0\.1\.16/@version 0.1.18/' '八卦搜索.user.js'
          grep -n '@version' 'versions/八卦搜索-0.1.18.user.js'
          grep -n '@version' '八卦搜索.user.js'

      - name: Commit rebuilt baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'versions/八卦搜索-0.1.16.user.js' 'versions/八卦搜索-0.1.18.user.js' '八卦搜索.user.js'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: rebuild 0.1.18 baseline from verified 0.1.16'
            git push
          fi